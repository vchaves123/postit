# Monta o pacote instalavel do Recados. Roda em Windows porque o produto e de Windows: o
# jpackage so gera .msi na propria plataforma, e o icone da barra de tarefas depende do exe
# nativo. Cada execucao deixa o instalador e o portavel como artefatos; tag "v*" publica uma
# release com os dois anexados.
name: Pacote do Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # para a release; o resto do workflow so precisa de leitura

jobs:
  pacote:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B -ntp package

      # As checagens abrem janelas Swing de verdade. O runner do Windows tem sessao grafica,
      # entao elas rodam; se algum dia deixarem de rodar por falta de tela, o erro aqui vai
      # dizer isso em voz alta em vez de o pacote sair sem ter sido conferido.
      - name: Checagens
        run: powershell -ExecutionPolicy Bypass -File run-checks.ps1

      # O jpackage gera .msi chamando candle.exe e light.exe do WiX 3. O WiX 4 nao serve: ele
      # nao tem mais essas duas ferramentas.
      #
      # A imagem do runner ja vem com uma versao do WiX 3 (hoje a 3.14), e pedir uma versao
      # fixa faz o choco falhar por "downgrade". Entao: procura primeiro, instala so se
      # faltar, e descobre a pasta em vez de fixar o numero da versao no caminho.
      - name: WiX Toolset 3
        run: |
          function Find-WixBin {
            Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' `
                -ErrorAction SilentlyContinue |
              Sort-Object Name |
              ForEach-Object { Join-Path $_.FullName 'bin' } |
              Where-Object { Test-Path (Join-Path $_ 'candle.exe') } |
              Select-Object -Last 1
          }
          $bin = Find-WixBin
          if (-not $bin) {
            Write-Output 'WiX 3 nao encontrado na imagem; instalando.'
            choco install wixtoolset --no-progress -y
            $bin = Find-WixBin
          }
          if (-not $bin) { throw 'WiX 3 (candle.exe) nao encontrado; o .msi nao sairia.' }
          Write-Output "WiX 3 em: $bin"
          $bin >> $env:GITHUB_PATH

      # Numa tag v1.2.3 a versao do pacote e 1.2.3; fora de tag, 0.0.<numero da execucao>,
      # que mantem os pacotes de teste distinguiveis e nunca colide com uma versao publicada.
      - name: Versao do pacote
        id: versao
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          Write-Output "valor=$v" >> $env:GITHUB_OUTPUT
          Write-Output "Versao do pacote: $v"

      - name: Empacotar
        run: powershell -ExecutionPolicy Bypass -File package-installer.ps1 -Version ${{ steps.versao.outputs.valor }}

      - name: Conferir o que saiu
        run: |
          $itens = Get-ChildItem target\instalador
          if (-not ($itens | Where-Object Extension -eq '.msi')) {
            throw 'O .msi nao foi gerado.'
          }
          if (-not ($itens | Where-Object Extension -eq '.zip')) {
            throw 'O portavel nao foi gerado.'
          }
          $itens | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table

      - name: Guardar os pacotes
        uses: actions/upload-artifact@v5
        with:
          name: recados-windows-${{ steps.versao.outputs.valor }}
          path: target/instalador/*
          if-no-files-found: error

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/instalador/*
          generate_release_notes: true
